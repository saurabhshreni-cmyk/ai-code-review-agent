name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore CodeReviewAPI/CodeReviewAPI.csproj

    - name: Build
      run: dotnet build CodeReviewAPI/CodeReviewAPI.csproj --no-restore -c Release

    - name: Verify output
      run: |
        echo "Build complete"
        ls CodeReviewAPI/bin/Release/net10.0/ | head -20
